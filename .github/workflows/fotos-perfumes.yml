# Baixa as fotos dos perfumes (site-perfumes/imagens/perfumes/) e salva no branch.
# Roda sozinho quando data/imagens.js muda, ou manualmente pela aba Actions.
name: Fotos dos perfumes

on:
  push:
    branches: [main, claude/site-perfumes-dupes]
    paths:
      - "site-perfumes/data/imagens.js"
      - ".github/workflows/fotos-perfumes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baixar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site-perfumes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Baixar fotos
        run: node scripts/baixar-imagens.mjs || echo "Algumas fotos falharam; as que baixaram serão salvas."

      - name: Salvar fotos no branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add imagens
          if git diff --cached --quiet; then
            echo "Nenhuma foto nova."
            exit 0
          fi
          git commit -m "Baixa fotos dos perfumes"
          git push
