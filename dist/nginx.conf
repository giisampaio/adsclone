worker_processes auto;
events { worker_connections 4096; multi_accept on; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  server_tokens off;
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_types text/plain text/css application/json application/javascript text/javascript application/wasm;
  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location ~* \.(js|mjs|css|wasm|json|png|jpg|jpeg|gif|ico|svg|ttf|otf|woff|woff2|bin|frag)$ {
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /flutter_service_worker.js { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
